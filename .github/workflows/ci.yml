# CI pipeline implementing the flow already designed in
# docs/13_DEPLOYMENT.md §4: Lint -> Test -> Dependency Audit.
#
# Compatibility matrix (docs/06_TECHNICAL_REQUIREMENTS.md §7) is reflected
# in the os/python-version build matrix below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip and base packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[dev]"
      - run: black --check src tests
      - run: ruff check src tests

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matches docs/06_TECHNICAL_REQUIREMENTS.md §7 Compatibility Matrix
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip and base packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[dev,viz]"
      - name: Run unit + integration tests
        run: pytest --cov=qst --cov-report=xml
      - name: Run critical security-regression tests
        # These correspond to docs/11_SECURITY_ARCHITECTURE.md §4 -- must
        # always pass before merge, run explicitly and separately so a
        # failure here is unambiguous in CI output.
        run: pytest -m critical -v

  security-audit:
    name: Dependency Security Scan (pip-audit)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip and base packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[dev]"
      - name: Run pip-audit
        # Per docs/11_SECURITY_ARCHITECTURE.md §10 -- runs on every PR plus
        # (separately, not shown here) a scheduled scan against main.
        run: pip-audit

  # SBOM generation (docs/11_SECURITY_ARCHITECTURE.md §10) and PyPI publish
  # (docs/13_DEPLOYMENT.md §6, docs/19_RELEASE_PLAN.md) are intentionally
  # left as a separate release.yml workflow, triggered on tag push --
  # not implemented yet, since no release process has been exercised
  # (see docs/01_REPOSITORY_AUDIT.md).
